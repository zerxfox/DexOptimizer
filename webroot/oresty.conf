location ~* /dex_optimizer/webroot/.*\.sh$ {
            root /data/adb/modules;
            default_type text/plain;
            content_by_lua_block {
                local pipe = require("ngx.pipe")
                local uri = ngx.var.uri
                local script_path = ngx.var.document_root .. uri
        
                local file = io.open(script_path, "r")
                if not file then
                    ngx.status = 404
                    ngx.say("Error: script not found")
                    return
                end
                file:close()
        
                local args_str = ngx.var.query_string or ""
                local args_table = {}
                for arg in string.gmatch(args_str, "[^&]+") do
                    table.insert(args_table, arg)
                end
        
                local command = {"sh", script_path}
                for _, v in ipairs(args_table) do
                    table.insert(command, v)
                end
        
                local proc, err = pipe.spawn(command, { stdout = true, stderr = true })
                if not proc then
                    ngx.status = 500
                    ngx.say("Error: failed to execute script - ", err)
                    return
                end

                proc:set_timeouts(300000, 3600000, 3600000, 86400000)

                ngx.header["Content-Type"] = "text/plain"
                ngx.flush(true)
        
                while true do
                    local line, err = proc:stdout_read_line()
                    if not line then
                        break
                    end
                    ngx.say(line)
                    ngx.flush(true)
                end
        
                proc:wait()
            }
        }
        
        location /dex_optimizer/logs {
          content_by_lua_block {
            ngx.header["Cache-Control"] = "no-store"
            local ok, data, new_offset, reset, id = pcall(function()
                local rs = dofile("/data/adb/modules/dex_optimizer/webroot/runstate.lua")
                local log_id = ngx.var.arg_id and ngx.unescape_uri(ngx.var.arg_id)
                return rs.read_log(rs.LOG_FILE, ngx.var.arg_offset, log_id)
            end)
            if not ok then
                ngx.status = 500
                ngx.say("Error reading log: ", tostring(data))
                return
            end

            if id then ngx.header["X-Log-Id"] = id end
            if reset then ngx.header["X-Log-Reset"] = "1" end
            if not data or #data == 0 then
                ngx.status = 204
                return
            end

            ngx.header["Content-Type"] = "text/plain"
            ngx.header["X-Log-Offset"] = tostring(new_offset)
            ngx.print(data)
          }
        }

        location = /dex_optimizer/run_state {
          content_by_lua_block {
            ngx.header["Content-Type"] = "application/json"
            ngx.header["Cache-Control"] = "no-store"
            local ok, res = pcall(function()
                local rs = dofile("/data/adb/modules/dex_optimizer/webroot/runstate.lua")
                return rs.to_json(rs.state())
            end)
            ngx.say(ok and res or '{"running":false}')
          }
        }

        location = /dex_optimizer/apps_index {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json; charset=utf-8"
                ngx.header["Cache-Control"] = "no-store"

                local MODULE = "/data/adb/modules/dex_optimizer/webroot/applabel.lua"
                local ok, res = pcall(function()
                    local lbl = dofile(MODULE)
                    if lbl.begin_sync(ngx.var.arg_force == "1") then
                        ngx.timer.at(0, function(premature)
                            if premature then return end
                            local okt, err = pcall(function()
                                local l = dofile(MODULE)
                                l.sync({ yield = function() ngx.sleep(0.02) end })
                            end)
                            if not okt then ngx.log(ngx.ERR, "label sync: ", err) end
                        end)
                    end
                    return lbl.index_json(nil, lbl.sync_state().running)
                end)
                ngx.say(ok and res or '{"syncing":false,"apps":[]}')
            }
        }

        location /dex_optimizer/labels {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json; charset=utf-8"
                ngx.header["Cache-Control"] = "no-store"

                local pkgs = {}
                for p in ngx.unescape_uri(ngx.var.arg_pkgs or ""):gmatch("[%w%._]+") do
                    pkgs[#pkgs + 1] = p
                    if #pkgs >= 60 then break end
                end

                local ok, res = pcall(function()
                    local lbl = dofile("/data/adb/modules/dex_optimizer/webroot/applabel.lua")
                    return lbl.to_json(lbl.resolve(pkgs))
                end)
                ngx.say(ok and res or "{}")
            }
        }

       location /dex_optimizer/search_apps {
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain"

                local app_name = ngx.var.arg_app_name or ""
                local handle = io.popen("pm list packages 2>/dev/null | cut -d':' -f2")

                if handle then
                    local packages = handle:read("*a") or ""
                    handle:close()

                    local all = {}
                    for pkg in packages:gmatch("[^\n]+") do all[#all + 1] = pkg end

                    local matched = {}
                    local okm, res = pcall(function()
                        local lbl = dofile("/data/adb/modules/dex_optimizer/webroot/applabel.lua")
                        return lbl.matches(all, app_name)
                    end)
                    if okm then
                        matched = res
                    else
                        for _, pkg in ipairs(all) do
                            if pkg:lower():find(app_name:lower(), 1, true) then
                                table.insert(matched, pkg)
                            end
                        end
                    end

                    if #matched > 0 then
                        ngx.say(table.concat(matched, "\n"))
                    else
                        ngx.say("")
                    end
                else
                    ngx.status = 500
                    ngx.say("Internal error")
                end
            }
        }

        location /dex_optimizer/stats.txt {
            default_type text/plain;
            content_by_lua_block {
                local file = io.open("/data/adb/modules/dex_optimizer/webroot/stats.txt", "r")
                if file then
                    local content = file:read("*all")
                    file:close()
                    ngx.say(content)
                else
                    ngx.status = ngx.HTTP_NOT_FOUND
                    ngx.say("File not found")
                end
            }
        }

        location /dex_optimizer/last_run_time {
            default_type text/plain;
            content_by_lua_block {
                local file = io.open("/data/adb/modules/dex_optimizer/webroot/stats.txt", "r")
                if not file then
                    ngx.status = ngx.HTTP_NOT_FOUND
                    return
                end

                local last_line
                for line in file:lines() do
                    if line ~= "" then last_line = line end
                end
                file:close()

                local ts = last_line and last_line:match("^(%d+)|")
                if ts then
                    ngx.say(ts)
                else
                    ngx.status = ngx.HTTP_NOT_FOUND
                end
            }
        }

        location /dex_optimizer/stats {
            default_type application/json;
            content_by_lua_block {
                local file = io.open("/data/adb/modules/dex_optimizer/webroot/stats.txt", "r")

                local lines = {}
                if file then
                    for line in file:lines() do
                        local ts, kind, dur, total, ok =
                            line:match("^(%d+)|(%a+)|(%d+)|(%d+)|(%d+)$")
                        if ts then
                            table.insert(lines, {
                                ts = tonumber(ts), kind = kind,
                                dur = tonumber(dur), total = tonumber(total),
                                ok = tonumber(ok),
                            })
                        end
                    end
                    file:close()
                end

                local optimized, runs = 0, #lines
                local speedGain, lastRun, dexPct = "null", "null", "null"
                local compileRuns = {}

                if #lines > 0 then
                    local last = lines[#lines]
                    lastRun = tostring(last.ts)

                    if last.total and last.total > 0 then
                        dexPct = tostring(math.floor((last.ok / last.total) * 100 + 0.5))
                    end

                    for _, l in ipairs(lines) do
                        if l.kind == "compile" or l.kind == "profile" then
                            optimized = optimized + (l.ok or 0)
                        end
                        if l.kind == "compile" and l.total and l.total > 0 then
                            table.insert(compileRuns, l)
                        end
                    end

                    if #compileRuns >= 2 then
                        local lastC = compileRuns[#compileRuns]
                        local lastAvg = lastC.dur / lastC.total
                        local sumAvg = 0
                        for i = 1, #compileRuns - 1 do
                            sumAvg = sumAvg + (compileRuns[i].dur / compileRuns[i].total)
                        end
                        local prevAvg = sumAvg / (#compileRuns - 1)
                        if prevAvg > 0 then
                            speedGain = tostring(math.floor(((prevAvg - lastAvg) / prevAvg) * 100 + 0.5))
                        end
                    end
                end

                local MAX_RUNS = 30
                local start_idx = #compileRuns - MAX_RUNS + 1
                if start_idx < 1 then start_idx = 1 end

                local chart_parts = {}
                for i = start_idx, #compileRuns do
                    local l = compileRuns[i]
                    local avg = math.floor((l.dur / l.total) * 100 + 0.5) / 100
                    local label = os.date("%d.%m %H:%M", l.ts)
                    table.insert(chart_parts, string.format('{"date":"%s","time":%.2f}', label, avg))
                end

                local json = string.format(
                    '{"optimized":%d,"runs":%d,"speedGain":%s,"lastRun":%s,"dexPct":%s,"chart":[%s]}',
                    optimized, runs, speedGain, lastRun, dexPct, table.concat(chart_parts, ",")
                )

                ngx.say(json)
            }
        }

        location /dex_optimizer/clear_stats {
            content_by_lua_block {
                local file_path = "/data/adb/modules/dex_optimizer/webroot/stats.txt"
                local file = io.open(file_path, "w")
                if file then
                    file:close()
                    ngx.say("OK")
                else
                    ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                    ngx.say("ERROR")
                end
            }
        }

        location = /dex_optimizer/update {
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain"
                if ngx.req.get_method() ~= "POST" then
                    ngx.status = ngx.HTTP_NOT_ALLOWED
                    return
                end

                local mode = ngx.var.arg_mode or "download"
                if mode ~= "download" and mode ~= "install" and mode ~= "cancel" then
                    ngx.status = ngx.HTTP_BAD_REQUEST
                    ngx.say("Error: bad mode")
                    return
                end

                local base = "/data/adb/modules/dex_optimizer/webroot/"
                local script_path = base .. "update.sh"
                local state_path = base .. "update_state"

                local f = io.open(script_path, "r")
                if not f then
                    ngx.status = ngx.HTTP_NOT_FOUND
                    ngx.say("Error: script not found")
                    return
                end
                f:close()

                local function read_state()
                    local sf = io.open(state_path, "r")
                    if not sf then return "" end
                    local line = sf:read("*l") or ""
                    sf:close()
                    return line
                end
                local function write_state(v)
                    local sf = io.open(state_path, "w")
                    if sf then sf:write(v, "\n"); sf:close() end
                end

                if mode == "download" then
                    write_state("checking")
                elseif mode == "install" then
                    local ver = read_state():match("^ready|(.+)$")
                    if not ver then
                        ngx.status = 409
                        ngx.say("Error: no downloaded update")
                        return
                    end
                    write_state("installing|" .. ver)
                end

                os.execute("sh '" .. script_path .. "' mode=" .. mode .. " >/dev/null 2>&1 &")
                ngx.say("OK")
            }
        }

        location = /dex_optimizer/update_state {
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain"
                ngx.header["Cache-Control"] = "no-store"

                local f = io.open("/data/adb/modules/dex_optimizer/webroot/update_state", "r")
                local line = f and f:read("*l") or nil
                if f then f:close() end
                if not line or line == "" then line = "idle" end
                ngx.say(line)
            }
        }

        location /dex_optimizer/check-update {
            content_by_lua_block {
            local net = package.loaded["dexnet"]
            if not net then
                net = dofile("/data/adb/modules/dex_optimizer/webroot/dexnet.lua")
                package.loaded["dexnet"] = net
            end

                local info, err = net.fetch_info()
                if not info then
                    ngx.status = 502
                    ngx.header["Content-Type"] = "text/plain"
                    ngx.say("Error: " .. tostring(err))
                    return
                end

                ngx.header["Content-Type"] = "application/json"
                ngx.say(string.format('{"version":"%s","zip_url":"%s"}', info.version, info.zipUrl))
            }
        }

        location /dex_optimizer/download-update {
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain"
                if ngx.req.get_method() ~= "POST" then
                    ngx.status = ngx.HTTP_NOT_ALLOWED
                    return
                end

            local net = package.loaded["dexnet"]
            if not net then
                net = dofile("/data/adb/modules/dex_optimizer/webroot/dexnet.lua")
                package.loaded["dexnet"] = net
            end

                local info, err = net.fetch_info()
                if not info then
                    ngx.status = 502
                    ngx.say("ERROR " .. tostring(err))
                    return
                end

                local ok, derr = net.download(info.zipUrl)
                if not ok then
                    ngx.status = 502
                    ngx.say("ERROR " .. tostring(derr))
                    return
                end

                ngx.say("OK")
            }
        }

        location /dex_optimizer/changelog {
            content_by_lua_block {
            local net = package.loaded["dexnet"]
            if not net then
                net = dofile("/data/adb/modules/dex_optimizer/webroot/dexnet.lua")
                package.loaded["dexnet"] = net
            end

                local res, err = net.get(net.CHANGELOG_URL, 15000)
                if not res or res.status ~= 200 then
                    ngx.status = 502
                    ngx.header["Content-Type"] = "text/plain"
                    ngx.say("Error: " .. tostring(err or ("HTTP " .. res.status)))
                    return
                end

                ngx.header["Content-Type"] = "text/plain; charset=utf-8"
                ngx.print(res.body)
            }
        }
